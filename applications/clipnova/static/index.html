<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipNova</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main style="max-width:640px">
  <header><h1>Clip<span>Nova</span></h1>
    <p class="sub">Donne un lien, choisis tes réglages, ClipNova fait les clips.</p></header>

  <form class="card" id="form">
    <label for="url">Lien de la vidéo (YouTube, TikTok, Instagram, Facebook…)
      <input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=…"></label>
    <div class="or">ou</div>
    <label for="file">Vidéo depuis ton téléphone / PC<input id="file" name="file" type="file" accept="video/*"></label>

    <h2>Réglages</h2>
    <div class="grid">
      <label for="lang">Langue de la vidéo
        <select id="lang" name="lang"><option value="fr">Français</option><option value="ar">Arabe / Darija</option>
          <option value="en">Anglais</option><option value="es">Espagnol</option><option value="auto">Détection auto</option></select></label>
      <label for="count">Nombre de clips<input id="count" name="count" type="number" value="10" min="1" max="30"></label>
      <label for="min_d">Durée min (secondes)<input id="min_d" name="min_d" type="number" value="20" min="5"></label>
      <label for="max_d">Durée max (secondes)<input id="max_d" name="max_d" type="number" value="60" min="10"></label>
      <label for="model">Précision des sous-titres
        <select id="model" name="model"><option value="base">Rapide</option><option value="small" selected>Normale</option><option value="medium">Haute (lent)</option></select></label>
      <label for="color">Couleur du mot prononcé<input id="color" type="color" value="#ffe500"></label>
    </div>
    <label class="check" for="subs"><input id="subs" type="checkbox" checked> Ajouter les sous-titres</label>
    <button id="go">Générer les clips</button>
    <p class="note">Tu pourras tout modifier ensuite : sous-titres, couleurs, musique, coupe, zoom. Utilise seulement des vidéos que tu as le droit de réutiliser.</p>
  </form>

  <div class="card" id="progress" hidden>
    <div id="status">Envoi…</div><div class="bar"><i id="bar"></i></div>
  </div>
</main>
<script>
const form = document.getElementById('form'), go = document.getElementById('go');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(form);
  fd.set('color', document.getElementById('color').value.slice(1));
  fd.set('subs', document.getElementById('subs').checked);
  go.disabled = true; document.getElementById('progress').hidden = false;
  try {
    const res = await fetch('/api/jobs', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Erreur');
    location.href = '/clips?job=' + data.id;
  } catch (err) {
    document.getElementById('status').innerHTML = '<span class="err">' + err.message + '</span>';
    go.disabled = false;
  }
});
</script>
</body>
</html>
