<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" role="img" aria-label="Tanger Carreaux">
  <defs>
    <linearGradient id="tc-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b795"/><stop offset="1" stop-color="#0f8f72"/>
    </linearGradient>
  </defs>

  <!-- tile block behind CARREAUX -->
  <g>
    <rect x="296" y="92" width="338" height="54" fill="url(#tc-green)"/>
    <g stroke="#eafaf4" stroke-width="1.5">
      <line x1="363.6" y1="92" x2="363.6" y2="146"/>
      <line x1="431.2" y1="92" x2="431.2" y2="146"/>
      <line x1="498.8" y1="92" x2="498.8" y2="146"/>
      <line x1="566.4" y1="92" x2="566.4" y2="146"/>
      <line x1="296" y1="119" x2="634" y2="119"/>
    </g>
  </g>

  <!-- small flourish accent above/through the T -->
  <path d="M 38,88 Q 66,60 104,70" fill="none" stroke="#101210" stroke-width="5" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="58" y="133" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="54" letter-spacing="1" fill="#101210">TANGER</text>
  <text x="308" y="133" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="54" letter-spacing="1" fill="#101210">CARREAUX</text>

  <!-- long sweeping underline flourish (continues from the flourish accent above) -->
  <path d="M 38,88 C 45,185 240,205 380,186 C 480,172 555,157 602,143 C 616,139 626,132 632,122"
        fill="none" stroke="#101210" stroke-width="5" stroke-linecap="round"/>

  <!-- S.A.R.L. small vertical label -->
  <text x="656" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#6f7873"
        transform="rotate(-90 656 150)">S.A.R.L.</text>
</svg>
